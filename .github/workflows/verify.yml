# `make verify` on every pull request: the architecture and sensitive-data checks, the tests and the Debug build.
# No secrets and no signing: Debug signs ad hoc.
name: Verify

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    # The image with Xcode 27.1 (27A9275), the one that builds the app today; macos-26 stops at Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      # Pinned to v7.0.1's commit, like every dependency that runs with the repo's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: xcodebuild -version
      - name: Verify
        run: make verify
