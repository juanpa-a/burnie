name: Burnie
options:
  bundleIdPrefix: dev.juanpa
  deploymentTarget: { macOS: "14.0" }
packages:
  BurnieKit: { path: BurnieKit }
  # Pinned: Sparkle replaces the installed app, so a new version comes in through a reviewed PR.
  Sparkle: { url: https://github.com/sparkle-project/Sparkle, exactVersion: 2.10.0 }
targets:
  BurnieApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [AGENTS.md, CLAUDE.md]
    dependencies:
      - package: BurnieKit
        product: BurnieCore
      - package: BurnieKit
        product: BurnieSystem
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.juanpa.burnie
        PRODUCT_NAME: Burnie
        # 0.x while Burnie is an MVP. Sparkle compares CURRENT_PROJECT_VERSION, so it goes up by one on every release.
        MARKETING_VERSION: 0.2.3
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: App/Burnie.entitlements
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Burnie
      configs:
        # Release signs with a Developer ID; the team comes from `make release TEAM_ID=…`.
        # Only it has the hardened runtime, which notarization needs: under it, an ad hoc app can't load
        # the embedded Sparkle.framework, because library validation wants both signed by the same team.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(BURNIE_TEAM_ID)
          OTHER_CODE_SIGN_FLAGS: --timestamp
    scheme: {}
